version: "3.8"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geosurge_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: geosurge_ner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: geosurge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: geosurge_backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password123@db:5432/geosurge_ner
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"

volumes:
  postgis_data:
